# Served by Cloud Run. ${PORT} is substituted at container start (default 8080).
server {
    listen       ${PORT};
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # gzip the text assets nginx serves
    gzip            on;
    gzip_types      text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Licensed market data (Mintel/Statista/PDI-derived) — gated by HTTP Basic Auth.
    # The dashboard's login form fetches this with credentials; without them the
    # server never sends the data, so the JS gate can't be bypassed for the data.
    #
    # PREFIX, not `location = /data/dashboard.json`. The exact-match form guarded
    # exactly one filename, so every later aggregate added to public/data/ —
    # flavor_explorer.json among them — was served to anyone who asked. These are
    # reductions of licensed PDI and Mintel data and must not be public.
    location ^~ /data/ {
        auth_basic           "Bogus Banana // RESTRICTED";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header           Cache-Control "no-store";
    }

    # Admin console (Site Scout) data — separate credentials from the dashboard.
    # The admin page's login fetches /admin/config.json with Basic credentials;
    # same two-layer pattern as the dashboard (JS gate for UX, nginx for real).
    location ^~ /admin/ {
        auth_basic           "BOGUS BANANA // ADMIN";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        add_header           Cache-Control "no-store";
    }

    # The analysis pages themselves, not just their data.
    #
    # Guarding only /data/ left a hole: these pages carry licensed figures in
    # their own PROSE — Passport-derived brand shares, the Mintel market sizing,
    # the channel-share history — baked into the HTML at build time. The JS
    # overlay hides them in a browser, but the bytes were already sent, and curl
    # never runs the JS. Verified with real nginx: every one of these returned
    # 200 to an anonymous request while the JSON beside them returned 401.
    #
    # Same realm and same file as /data/ on purpose. Once the browser has
    # authenticated for "Bogus Banana // RESTRICTED" to load the page, it
    # re-sends those credentials on the page's own fetch of /data/..., so the
    # visitor is prompted once rather than twice — see requireAuth in auth.js.
    #
    # index.html is deliberately NOT here: the marketing landing page is public
    # and carries no licensed figures. A regex location is needed because these
    # are specific files rather than a path prefix; regex wins over the `location /`
    # prefix below, and try_files is not inherited into it.
    location ~ ^/(dashboard|insights|segments|audience|compare|opportunity|explorer)\.html$ {
        auth_basic           "Bogus Banana // RESTRICTED";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header           Cache-Control "no-store";
        try_files            $uri =404;
    }

    # Multi-page static site: real files (index.html, dashboard.html) serve
    # directly; unknown paths fall back to the landing page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}
