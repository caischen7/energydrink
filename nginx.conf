# Served by Cloud Run. ${PORT} is substituted at container start (default 8080).
server {
    listen       ${PORT};
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # gzip the text assets nginx serves
    gzip            on;
    gzip_types      text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Licensed market data (Mintel/Statista/PDI-derived) — gated by HTTP Basic Auth.
    # The dashboard's login form fetches this with credentials; without them the
    # server never sends the data, so the JS gate can't be bypassed for the data.
    #
    # PREFIX, not `location = /data/dashboard.json`. The exact-match form guarded
    # exactly one filename, so every later aggregate added to public/data/ —
    # flavor_explorer.json among them — was served to anyone who asked. These are
    # reductions of licensed PDI and Mintel data and must not be public.
    location ^~ /data/ {
        auth_basic           "Bogus Banana // RESTRICTED";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header           Cache-Control "no-store";
    }

    # Admin console (Site Scout) data — separate credentials from the dashboard.
    # The admin page's login fetches /admin/config.json with Basic credentials;
    # same two-layer pattern as the dashboard (JS gate for UX, nginx for real).
    location ^~ /admin/ {
        auth_basic           "BOGUS BANANA // ADMIN";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        add_header           Cache-Control "no-store";
    }

    # Multi-page static site: real files (index.html, dashboard.html) serve
    # directly; unknown paths fall back to the landing page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}
